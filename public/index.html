<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Superjoin</title>
  <style>
    :root {
      --bg: #fafafa;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2563eb;
      --track: #eceef1;
      --green-bg: #e7f6ec; --green-fg: #1a7f42;
      --red-bg: #fdeaea;   --red-fg: #b42318;
      --amber-bg: #fdf4e3; --amber-fg: #92600b;
      --gray-bg: #eef0f2;  --gray-fg: #4b5563;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a;
        --card: #1c1f24;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --border: #2c2f36;
        --accent: #5b9bff;
        --track: #2a2d33;
        --green-bg: #12331f; --green-fg: #6ee7a0;
        --red-bg: #3a1b1b;   --red-fg: #f5a9a0;
        --amber-bg: #3a2f14; --amber-fg: #f0c674;
        --gray-bg: #2a2d33;  --gray-fg: #b8bcc2;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 40px 20px 80px; }

    header h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
    header p { margin: 0 0 32px; color: var(--muted); font-size: 14px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }
    h2 { margin: 0 0 14px; font-size: 15px; font-weight: 600; }

    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    input[type=file] { font: inherit; color: var(--muted); max-width: 100%; }
    button {
      font: inherit; font-weight: 500;
      background: var(--accent); color: #fff;
      border: 0; border-radius: 7px;
      padding: 8px 16px; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
    select {
      font: inherit; color: var(--text);
      background: var(--card); border: 1px solid var(--border);
      border-radius: 7px; padding: 6px 10px;
    }

    /* progress */
    .progress .bar-track {
      height: 8px; background: var(--track);
      border-radius: 999px; overflow: hidden; margin: 12px 0 8px;
    }
    .progress .bar-fill {
      height: 100%; width: 0%;
      background: var(--accent);
      transition: width .4s ease;
    }
    .progress .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
    .spinner {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid var(--track); border-top-color: var(--accent);
      display: inline-block; vertical-align: -2px; margin-right: 8px;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .note { font-size: 13px; color: var(--muted); margin-top: 10px; }
    .error { color: var(--red-fg); }

    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr:last-child td { border-bottom: 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
    .chip { font-size: 12px; color: var(--muted); background: var(--gray-bg); border-radius: 5px; padding: 1px 6px; }

    .rel { border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 10px; }
    .rel .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 560px) { .rel .pair { grid-template-columns: 1fr; } }
    .rel .side .doc { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 3px; }
    .rel .side .txt { font-size: 14px; }
    .rel .foot { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    .rel .explain { font-size: 13px; color: var(--muted); }

    .badge { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; padding: 2px 8px; border-radius: 999px; }
    .badge.corroborates { background: var(--green-bg); color: var(--green-fg); }
    .badge.contradicts  { background: var(--red-bg);   color: var(--red-fg); }
    .badge.reconciled   { background: var(--amber-bg); color: var(--amber-fg); }
    .badge.unrelated    { background: var(--gray-bg);  color: var(--gray-fg); }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Superjoin</h1>
      <p>Extract facts from a PDF and cross-check them against your other documents.</p>
    </header>

    <div class="card">
      <h2>Upload a document</h2>
      <form id="form" class="row">
        <input type="file" id="file" name="file" accept="application/pdf" required>
        <button type="submit" id="submit">Analyze</button>
      </form>
      <div id="progress" class="progress" hidden>
        <div class="bar-track"><div class="bar-fill" id="fill"></div></div>
        <div class="meta">
          <span><span class="spinner"></span><span id="stage">Starting…</span></span>
          <span id="pcteta">0%</span>
        </div>
      </div>
      <div id="msg" class="note" hidden></div>
    </div>

    <div class="card" id="factsCard" hidden>
      <h2 id="factsTitle">Extracted facts</h2>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Fact</th><th>Details</th></tr></thead>
          <tbody id="factsBody"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0">Relationships</h2>
        <div class="row">
          <select id="scope">
            <option value="">All documents</option>
            <option value="cross">Between two documents</option>
            <option value="same">Within one document</option>
          </select>
          <select id="filter">
            <option value="">All types</option>
            <option value="contradicts">Contradicts</option>
            <option value="reconciled">Reconciled</option>
            <option value="corroborates">Corroborates</option>
          </select>
        </div>
      </div>
      <div id="rels" class="note" style="margin-top:14px">Loading…</div>
    </div>
  </div>

  <script>
    var form = document.getElementById('form');
    var fileInput = document.getElementById('file');
    var submitBtn = document.getElementById('submit');
    var progressBox = document.getElementById('progress');
    var fill = document.getElementById('fill');
    var stageEl = document.getElementById('stage');
    var pctEtaEl = document.getElementById('pcteta');
    var msg = document.getElementById('msg');

    function showMsg(text, isError) {
      msg.textContent = text;
      msg.classList.toggle('error', !!isError);
      msg.hidden = false;
    }

    function fmtEta(seconds) {
      if (!isFinite(seconds) || seconds <= 0) return '';
      var m = Math.floor(seconds / 60);
      var s = Math.round(seconds % 60);
      if (m > 0) return ' · ~' + m + 'm ' + s + 's left';
      return ' · ~' + s + 's left';
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      if (!fileInput.files[0]) return;

      submitBtn.disabled = true;
      msg.hidden = true;
      progressBox.hidden = false;
      setProgress(0, 'Uploading');
      document.getElementById('factsCard').hidden = true;

      try {
        var fd = new FormData();
        fd.append('file', fileInput.files[0]);
        var res = await fetch('/documents/upload', { method: 'POST', body: fd });
        var data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Upload failed');
        track(data.jobId, data.documentId);
      } catch (err) {
        progressBox.hidden = true;
        showMsg(err.message, true);
        submitBtn.disabled = false;
      }
    });

    function setProgress(pct, stage, etaSeconds) {
      fill.style.width = Math.max(0, Math.min(100, pct)) + '%';
      stageEl.textContent = stage || 'Working';
      pctEtaEl.textContent = Math.round(pct) + '%' + (etaSeconds ? fmtEta(etaSeconds) : '');
    }

    function track(jobId, documentId) {
      var t0 = Date.now(), pct0 = null, tPct0 = null;

      var timer = setInterval(async function () {
        var state = null, progress = null;
        try {
          var r = await fetch('/jobs/' + jobId);
          if (r.ok) {
            var j = await r.json();
            state = j.state;
            progress = j.progress;
          }
        } catch (_) {}

        // Fall back to the document row if the job record is gone.
        if (!state) {
          try {
            var dr = await fetch('/documents/' + documentId);
            var doc = await dr.json();
            if (doc.status === 'done') state = 'completed';
            else if (doc.status === 'failed') state = 'failed';
          } catch (_) {}
        }

        if (progress && typeof progress.pct === 'number') {
          var pct = progress.pct;
          var eta = null;
          if (pct0 === null && pct >= 5) { pct0 = pct; tPct0 = Date.now(); }
          if (pct0 !== null && pct > pct0) {
            var rate = (pct - pct0) / ((Date.now() - tPct0) / 1000); // %/sec
            if (rate > 0) eta = (100 - pct) / rate;
          }
          setProgress(pct, progress.stage, eta);
        }

        if (state === 'completed') {
          clearInterval(timer);
          setProgress(100, 'Done');
          setTimeout(function () { progressBox.hidden = true; }, 1200);
          submitBtn.disabled = false;
          loadFacts(documentId);
          loadRelationships();
        } else if (state === 'failed') {
          clearInterval(timer);
          progressBox.hidden = true;
          showMsg('Processing failed. Check the worker logs for details.', true);
          submitBtn.disabled = false;
        }
      }, 1500);
    }

    async function loadFacts(documentId) {
      try {
        var res = await fetch('/documents/' + documentId + '/facts');
        var facts = await res.json();
        var body = document.getElementById('factsBody');
        body.innerHTML = '';
        document.getElementById('factsTitle').textContent = 'Extracted facts (' + facts.length + ')';

        if (!facts.length) {
          body.innerHTML = '<tr><td colspan="2" style="color:var(--muted)">No facts extracted.</td></tr>';
        } else {
          facts.forEach(function (f) {
            var d = {};
            try { d = JSON.parse(f.content) || {}; } catch (_) {}
            var chips = '';
            if (d.subject) chips += chip('Subject', d.subject);
            if (d.value !== undefined && d.value !== null) chips += chip('Value', d.value);
            if (d.unit) chips += chip('Unit', d.unit);
            if (d.time_scope) chips += chip('Time', d.time_scope);
            var tr = document.createElement('tr');
            tr.innerHTML = '<td>' + esc(d.text || '') + '</td><td><div class="chips">' + chips + '</div></td>';
            body.appendChild(tr);
          });
        }
        document.getElementById('factsCard').hidden = false;
      } catch (err) {
        console.error(err);
      }
    }

    function chip(k, v) { return '<span class="chip">' + esc(k) + ': ' + esc(v) + '</span>'; }

    async function loadRelationships() {
      var type = document.getElementById('filter').value;
      var scope = document.getElementById('scope').value;
      var box = document.getElementById('rels');
      box.textContent = 'Loading…';
      try {
        var qs = [];
        if (type) qs.push('type=' + type);
        if (scope) qs.push('scope=' + scope);
        var res = await fetch('/relationships' + (qs.length ? '?' + qs.join('&') : ''));
        var rels = await res.json();
        if (!Array.isArray(rels) || !rels.length) {
          box.classList.add('note');
          box.textContent = scope === 'cross'
            ? 'No cross-document relationships yet. Run "npm run reanalyze" after uploading a second document.'
            : 'No relationships yet.';
          return;
        }
        box.classList.remove('note');
        box.innerHTML = rels.map(function (rel) {
          var a = safeParse(rel.sourceFactContent);
          var b = safeParse(rel.targetFactContent);
          return '' +
            '<div class="rel">' +
              '<div class="pair">' +
                '<div class="side"><div class="doc">' + esc(rel.sourceDocumentTitle) + '</div><div class="txt">' + esc(a.text || '') + '</div></div>' +
                '<div class="side"><div class="doc">' + esc(rel.targetDocumentTitle) + '</div><div class="txt">' + esc(b.text || '') + '</div></div>' +
              '</div>' +
              '<div class="foot">' +
                '<span class="badge ' + esc(rel.type) + '">' + esc(rel.type) + '</span>' +
                '<span class="explain">' + esc(rel.explanation || '') + '</span>' +
              '</div>' +
            '</div>';
        }).join('');
      } catch (err) {
        box.textContent = 'Failed to load relationships.';
      }
    }

    function safeParse(s) { try { return JSON.parse(s) || {}; } catch (_) { return {}; } }
    function esc(v) {
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    document.getElementById('filter').addEventListener('change', loadRelationships);
    document.getElementById('scope').addEventListener('change', loadRelationships);
    loadRelationships();
  </script>
</body>
</html>
